# XcodeGen spec for the native iOS prototype. Generate the project with
# scripts/bootstrap.sh (or `xcodegen generate` once engine.js and the Rust
# xcframework exist).
name: Posto
options:
  bundleIdPrefix: net.megaflora
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.10.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Posto:
    type: application
    platform: iOS
    sources:
      - path: Posto
    dependencies:
      - framework: native/build/PostoNative.xcframework
        embed: false
      - sdk: JavaScriptCore.framework
      - sdk: SafariServices.framework
    info:
      path: Posto/Info.plist
      properties:
        CFBundleDisplayName: Posto Native
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.megaflora.posto.native
        PRODUCT_NAME: Posto
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # The Rust static library is built without bitcode or Catalyst slices.
        SUPPORTS_MACCATALYST: NO
        OTHER_LDFLAGS: ["-ObjC"]
    preBuildScripts:
      - name: Bundle engine
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$HOME/.local/share/vite-plus/bin:/usr/local/bin:/opt/homebrew/bin:$PATH"
          if ! command -v node >/dev/null 2>&1; then
            echo "warning: node not found; keeping the existing engine.js"
            exit 0
          fi
          node "$SRCROOT/engine/build.mjs" "$SRCROOT/Posto/Resources/engine.js"
    scheme:
      environmentVariables: {}
schemes:
  Posto:
    build:
      targets:
        Posto: all
    run:
      config: Debug
    archive:
      config: Release
  Posto Demo:
    build:
      targets:
        Posto: all
    run:
      config: Debug
      commandLineArguments:
        "-PostoDemo": true
