[package]
name = "posto-tauri-shim"
version = "0.1.0"
edition = "2021"
publish = false
description = "The slice of Tauri's API that Posto's backend modules use, without a webview."

[dependencies]
posto-tauri-shim-macros = { path = "macros" }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs", "net"] }
