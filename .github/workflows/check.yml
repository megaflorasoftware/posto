name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    name: TypeScript & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm -r --if-present typecheck

      - name: Test
        run: pnpm -r --if-present test

      # Lint + format via Vite+ (pinned as a workspace dev dependency) — a
      # required gate. `--deny-warnings` makes the type-aware lint warnings
      # (all triaged to zero) fail CI if any creep back.
      - name: Format check (Vite+)
        run: pnpm exec vp check --no-lint

      - name: Lint (Vite+)
        run: pnpm exec vp lint --deny-warnings

  rust:
    name: Rust
    runs-on: ubuntu-22.04
    env:
      # No debuginfo in CI — cuts compile time and shrinks the cached target dir.
      CARGO_PROFILE_DEV_DEBUG: 0
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The job always runs (so the "Rust" check always reports a result), but
      # the expensive steps below only execute when Rust-relevant files change.
      # On a docs/TS-only PR the job finishes in seconds and still passes.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: changes
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - '.github/workflows/check.yml'

      - name: Install Linux dependencies
        if: steps.changes.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      # Version + components come from src-tauri/rust-toolchain.toml (single
      # source of truth, shared with local dev). Installed before the cache so
      # rust-cache keys on the pinned rustc version.
      - name: Install Rust toolchain
        if: steps.changes.outputs.rust == 'true'
        run: rustup show

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: steps.changes.outputs.rust == 'true'
        with:
          workspaces: src-tauri
          # Keep the compiled dependency cache even when clippy/tests fail, so a
          # red run doesn't force the next one to recompile everything.
          cache-on-failure: true

      - name: Format check
        if: steps.changes.outputs.rust == 'true'
        run: cargo fmt --check

      - name: Clippy
        if: steps.changes.outputs.rust == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        if: steps.changes.outputs.rust == 'true'
        run: cargo test
