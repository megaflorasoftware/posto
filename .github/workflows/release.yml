name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify-release:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify release source and version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tag must point to a commit contained in main" >&2
            exit 1
          fi

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the form v1.2.3" >&2
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(jq -r '.version' package.json)"
          tauri_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"

          for version in "$package_version" "$tauri_version" "$cargo_version"; do
            if [ "$version" != "$tag_version" ]; then
              echo "Release tag $GITHUB_REF_NAME does not match app version $version" >&2
              exit 1
            fi
          done

  release:
    needs: verify-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    environment: production-signing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      # Version + components come from src-tauri/rust-toolchain.toml (single
      # source of truth, shared with local dev and the Check workflow).
      # `rustup show` installs that pinned toolchain.
      - name: Install Rust toolchain
        working-directory: src-tauri
        run: rustup show

      # `tauri build` runs inside src-tauri and rustup auto-overrides to the
      # pinned toolchain, so the macOS cross-compile targets must be added to
      # *that* toolchain — adding them to `stable` (the previous approach) left
      # the pinned toolchain without x86_64-apple-darwin and broke the build.
      - name: Add macOS cross-compile targets
        if: matrix.platform == 'macos-latest'
        working-directory: src-tauri
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.args }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          umask 077
          certificate_path="$RUNNER_TEMP/posto-developer-id.p12"
          keychain_path="$RUNNER_TEMP/posto-signing.keychain-db"
          keychain_password="$(openssl rand -base64 48)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 3600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$certificate_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Stage Apple notarization key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          umask 077
          api_key_path="$RUNNER_TEMP/posto-notarization.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"
          {
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_KEY_PATH=$api_key_path"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Posto ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Remove Apple signing material
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/posto-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/posto-developer-id.p12" \
            "$RUNNER_TEMP/posto-notarization.p8"

      # Publish version-less aliases of each installer so the docs site can link to
      # https://github.com/megaflorasoftware/posto/releases/latest/download/<stable-name>,
      # which GitHub only supports when the filename is constant across releases.
      - name: Upload stable-named installers for direct download
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "$ARTIFACT_PATHS" | jq -r '.[]' | while read -r path; do
            # Windows artifact paths use backslashes, and its native jq writes
            # CRLF. Normalize both before filtering and splitting the path.
            path="${path%$'\r'}"
            path="${path//\\//}"
            case "$path" in
              *.dmg|*.exe|*.msi|*.AppImage|*.deb|*.rpm) ;;
              *) continue ;;
            esac
            base="$(basename "$path")"
            # Strip the version out of the filename, then collapse the doubled
            # separators the removal leaves behind (e.g. Posto_0.8.4_aarch64.dmg
            # -> Posto_aarch64.dmg, Posto-0.8.4-1.x86_64.rpm -> Posto-1.x86_64.rpm).
            stable="${base//$version/}"
            stable="${stable//__/_}"
            stable="${stable//--/-}"
            if [ "$stable" = "$base" ]; then
              echo "Skipping $base (no version found to strip)"
              continue
            fi
            cp "$path" "$(dirname "$path")/$stable"
            echo "Uploading $stable"
            gh release upload "$TAG" "$(dirname "$path")/$stable" --clobber --repo "$GITHUB_REPOSITORY"
          done
