[package]
name = "posto-images"
version = "0.1.0"
edition = "2021"
publish = false
description = "Decodes, resizes and encodes images for Posto."

# Kept apart from the app so its pixel loops build optimized even in debug
# builds: generic code is compiled in the crate that uses it.
[dependencies]
image = { version = "0.25", default-features = false, features = ["gif", "ico", "jpeg", "png", "tiff", "webp"] }
webp = { version = "0.3", default-features = false }
fast_image_resize = { version = "6", features = ["image"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3.27.0"
